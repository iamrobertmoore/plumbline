<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Plumbline. 22 of the 100 most-starred repositories on GitHub fail at least one check.">
  <title>Plumbline</title>
  <desc>A pre-ship auditor. 22 of the 100 most-starred installable repositories on GitHub do not do what they say they do.</desc>

  <defs>
    <style>
      .n  { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .m  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <rect width="1200" height="320" fill="#F7F5F1"/>
  <rect x="0" y="0" width="1200" height="6" fill="#C8912F"/>

  <!-- mark -->
  <g transform="translate(64,74) scale(2.1)">
    <line x1="32" y1="7" x2="32" y2="37" stroke="#14161A" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="32" cy="7" r="3" fill="#14161A"/>
    <path d="M32 35 L41 48 L32 58 L23 48 Z" fill="#C8912F"/>
    <path d="M32 35 L41 48 L32 48 Z" fill="#A8761F"/>
    <line x1="14" y1="58" x2="50" y2="58" stroke="#14161A" stroke-width="2.5" stroke-linecap="round" opacity="0.25"/>
  </g>

  <!-- wordmark -->
  <text class="n" x="236" y="132" font-size="56" font-weight="700" letter-spacing="5" fill="#14161A">PLUMBLINE</text>
  <text class="n" x="238" y="166" font-size="17" fill="#5C5A54">A pre-ship auditor. It checks whether your repository does what it says it does.</text>

  <!-- the finding, which is the point of the banner -->
  <line x1="236" y1="196" x2="1136" y2="196" stroke="#E4DFD6"/>

  <text class="n" x="236" y="243" font-size="40" font-weight="700" fill="#C8912F">22 of 100</text>
  <text class="n" x="470" y="234" font-size="15" fill="#14161A">of the most-starred installable repositories on GitHub</text>
  <text class="n" x="470" y="256" font-size="15" fill="#14161A">fail at least one check. 14,304,526 stars between them.</text>
  <text class="m" x="236" y="288" font-size="12" fill="#8A8578">measured 15 Sep 2026 · method and every correction in docs/MEASUREMENT.md</text>
</svg>
